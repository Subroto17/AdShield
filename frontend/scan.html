<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scan Advertisement - AdShield AI</title>

    <!-- Global CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />

    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  </head>

  <body>
    <!-- NAVBAR -->
    <div class="navbar">
      <a href="index.html" class="logo"><b>AdShield AI</b></a>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="scan.html" class="active">Scan Ad</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="report.html">Report Scam</a>
        <a href="learn.html">Learn</a>
        <a href="admin.html">Admin</a>
      </div>
    </div>

    <!-- SCAN CARD -->
    <div class="card-soft scan-card">
      <h2 class="scan-title">Analyze Advertisement</h2>

      <p class="scan-desc">
        Paste any advertisement text and let the AI detect if it's fake or
        genuine.
      </p>

      <!-- INPUT -->
      <textarea
        id="adText"
        rows="5"
        placeholder="Paste advertisement text here..."
      ></textarea>

      <!-- BUTTON -->
      <button
        type="button"
        class="btn-primary full-width-btn"
        onclick="predict()"
      >
        Analyze
      </button>

      <!-- LOADER -->
      <div id="loader">
        <div class="apple-bounce">
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
        <p class="scan-desc">Analyzing...</p>
      </div>

      <!-- RESULT -->
      <div id="risk-section">
        <div class="meter-circle" id="risk-circle">
          <span id="riskValue">0%</span>
        </div>

        <h3 id="resultText" class="center-text"></h3>

        <div class="card-border" id="highlightOutput"></div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer>© 2026 AdShield AI — Fake Advertisement Detection System</footer>

    <!-- Scripts -->
    <script src="assets/js/script.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  </body>
</html>
