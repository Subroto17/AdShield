<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - AdShield AI</title>

    <!-- Global CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />

    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  </head>

  <body>
    <!-- NAVBAR -->
    <div class="navbar">
      <a href="index.html" class="logo"><b>AdShield AI</b></a>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="scan.html">Scan Ad</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="report.html">Report Scam</a>
        <a href="learn.html">Learn</a>
        <a href="admin.html" class="active">Admin</a>
      </div>
    </div>

    <!-- ADMIN LOGIN AREA -->
    <div class="admin-wrapper" data-aos="zoom-in">
      <div class="admin-card">
        <h2 class="center-text">Admin Login</h2>
        <p class="scan-desc">Restricted access — authorized personnel only</p>

        <!-- LOGIN FORM -->
        <form onsubmit="event.preventDefault(); adminLogin();">
          <label>Username</label>
          <input
            type="text"
            id="adminUser"
            placeholder="Enter admin username"
            required
          />

          <label>Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="adminPass"
              placeholder="Enter password"
            />
            <span class="toggle-password" onclick="togglePassword()">👁️</span>
          </div>

          <button id="loginBtn" class="btn-primary" onclick="adminLogin()">
            <span id="loginText">Login</span>
            <span id="loginSpinner" class="spinner"></span>
          </button>
        </form>

        <!-- ERROR MESSAGE -->
        <div id="adminError" class="admin-error">Invalid admin credentials</div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer>© 2026 AdShield AI — Fake Advertisement Detection System</footer>

    <!-- Scripts -->
    <script src="assets/js/script.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  </body>
</html>
